      <!-- ===== ВИДЕО НА YOUTUBE: {{V_TITLE}} ===== -->
      <a class="video" href="{{VIDEO_URL}}" target="_blank" rel="noopener noreferrer">
        <span class="v-thumb" aria-hidden="true">
          <img src="https://i.ytimg.com/vi/{{VIDEO_ID}}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">
          <span class="v-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
        </span>
        <span class="v-copy">
          <span class="v-tag">{{V_TAG}}</span>
          <span class="v-title">{{V_TITLE}}</span>
          <span class="v-desc">{{V_DESC}}</span>
          <span class="v-btn">Смотреть на YouTube ↗</span>
        </span>
      </a>
